<!-- THANK YOU POPUP -->
<div id="thankYouModal" class="thank-you-modal">
  <div class="thank-you-box">
    <button id="closeModal" class="thank-you-close" aria-label="Close popup">
      ×
    </button>

    <h2>Thank You 💛</h2>

    <p>
      Your inquiry has been submitted successfully. I’ll personally review your
      message and follow up soon with availability, pricing, and next steps.
    </p>

    <a href="https://brigregoryphotos.com" class="thank-you-button">
      Back to Main Site
    </a>
  </div>
</div>

<style>
  .thank-you-modal {
    display: none;
    position: fixed;
    inset: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    background: rgba(0, 0, 0, 0.55);
    z-index: 99999;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }

  .thank-you-box {
    background: white;
    padding: 40px 30px;
    max-width: 500px;
    width: 100%;
    border-radius: 18px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    position: relative;
    box-sizing: border-box;
  }

  .thank-you-close {
    position: absolute;
    top: 12px;
    right: 16px;
    background: none;
    border: none;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
    color: black;
  }

  .thank-you-box h2 {
    margin: 0 0 15px;
    font-size: 26px;
  }

  .thank-you-box p {
    margin: 0 0 28px;
    line-height: 1.6;
    font-size: 16px;
  }

  .thank-you-button {
    display: inline-block;
    padding: 14px 28px;
    background: black;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-weight: 600;
  }

  @media (max-width: 600px) {
    .thank-you-modal {
      align-items: center;
      padding: 16px;
    }

    .thank-you-box {
      width: 100%;
      max-width: 360px;
      padding: 34px 22px 30px;
      border-radius: 16px;
    }

    .thank-you-box h2 {
      font-size: 24px;
    }

    .thank-you-box p {
      font-size: 15px;
      line-height: 1.55;
    }

    .thank-you-button {
      width: 100%;
      max-width: 230px;
      padding: 14px 18px;
    }
  }
</style>

<!-- THANK YOU POPUP SCRIPT -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(window.location.search);
    const modal = document.getElementById("thankYouModal");
    const closeBtn = document.getElementById("closeModal");

    if (params.get("success") === "true" && modal) {
      modal.style.display = "flex";

      window.history.replaceState(
        {},
        document.title,
        window.location.pathname
      );
    }

    if (closeBtn && modal) {
      closeBtn.addEventListener("click", function () {
        modal.style.display = "none";
      });

      modal.addEventListener("click", function (e) {
        if (e.target === modal) {
          modal.style.display = "none";
        }
      });
    }
  });
</script>
