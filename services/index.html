<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Change this title for each new page -->
  <title>Coming Soon | Brianna Gregory Photography</title>

  <!-- Your shared stylesheet -->
  <link rel="stylesheet" href="/main/booking/styles.css" />

  <style>
    .coming-soon-page {
      min-height: calc(100vh - 180px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      text-align: center;
    }

    .coming-soon-content {
      max-width: 700px;
    }

    .coming-soon-eyebrow {
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .coming-soon-content h1 {
      font-size: clamp(42px, 6vw, 80px);
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 24px;
    }

    .coming-soon-content p {
      font-size: 18px;
      line-height: 1.8;
      max-width: 560px;
      margin: 0 auto 30px;
    }

    .coming-soon-button {
      display: inline-block;
      padding: 14px 30px;
      border: 1px solid #222;
      text-decoration: none;
      color: inherit;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 12px;
      transition: 0.25s ease;
    }

    .coming-soon-button:hover {
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

  <!-- Mobile Menu Toggle -->
  <input type="checkbox" id="menu-toggle" class="menu-toggle" />

  <!-- Mobile Hamburger Button -->
  <label for="menu-toggle" class="hamburger" aria-label="Open mobile menu">
    <span></span>
    <span></span>
  </label>

  <!-- Mobile Side Menu -->
  <aside class="side-menu">
    <label for="menu-toggle" class="close-menu">×</label>
    <a href="https://brigregoryphotos.com/">Home</a>
    <a href="https://brigregoryphotos.com/portfolio">Portfolio</a>
    <a href="https://brigregoryphotos.com/about/">About</a>
    <a href="https://brigregoryphotos.com/main/booking/">Book</a>
    <a href="https://brigregoryphotos.com/privacy-policy/">Privacy Policy</a>
    <a href="https://instagram.com/photo.britheg" target="_blank" rel="noopener">Instagram</a>
  </aside>

  <!-- Desktop Header -->
  <header class="site-header">
    <nav class="site-nav">
      <a href="https://brigregoryphotos.com/">Home</a>
      <a href="https://brigregoryphotos.com/portfolio">Portfolio</a>
      <a href="https://brigregoryphotos.com/about/">About</a>
      <a href="https://brigregoryphotos.com/main/booking/">Book</a>
      <a href="https://brigregoryphotos.com/privacy-policy/">Privacy Policy</a>
    </nav>
  </header>

  <!-- PAGE PLACEHOLDER CONTENT -->
  <main class="coming-soon-page">
    <section class="coming-soon-content">
      <p class="coming-soon-eyebrow">Brianna Gregory Photography</p>

      <h1>Coming Soon...</h1>

      <p>
        This page is currently being created. Please check back soon for new content.
      </p>

      <a href="https://brigregoryphotos.com" class="coming-soon-button">
        Back to Home
      </a>
    </section>
  </main>

  <!-- Footer -->
  <footer class="booking-footer">
    <a href="mailto:booking@brigregoryphotos.com">booking@brigregoryphotos.com</a>
    <p>© 2026 Brianna Gregory Photography</p>
  </footer>

</body>
</html>
