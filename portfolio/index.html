<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio | Brianna Gregory Photography</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Cormorant Garant', 'Times New Roman', serif;
      background: #f7f3ee;
      color: #1a1614;
    }
    a { color: inherit; text-decoration: none; }
    .site-header {
      background: #f7f3ee;
      border-bottom: 1px solid #ddd5ca;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .site-nav {
      height: 88px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6%;
    }
    .nav-logo {
      font-size: 12px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      font-weight: 300;
    }
    .nav-links {
      display: flex;
      gap: 50px;
    }
    .nav-links a {
      font-size: 10.5px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #6b5f58;
      font-weight: 300;
      transition: color 0.25s;
    }
    .nav-links a:hover { color: #1a1614; }
    .portfolio-page {
      padding: 120px 6% 160px;
    }
    .portfolio-hero {
      max-width: 820px;
      margin: 0 auto 110px;
      text-align: center;
    }
    .portfolio-eyebrow {
      display: block;
      font-size: 10.5px;
      letter-spacing: 0.52em;
      text-transform: uppercase;
      color: #9a8f86;
      font-weight: 300;
      margin-bottom: 38px;
    }
    .portfolio-hero h1 {
      margin: 0 0 38px;
      font-size: 120px;
      font-weight: 300;
      font-style: italic;
      line-height: 0.88;
      letter-spacing: -0.04em;
    }
    .hero-rule {
      width: 38px;
      height: 1px;
      background: #c4b9b0;
      margin: 0 auto 34px;
      border: none;
    }
    .portfolio-hero p {
      max-width: 540px;
      margin: 0 auto;
      font-size: 18px;
      line-height: 1.9;
      font-style: italic;
      font-weight: 300;
      color: #6b5f58;
    }
    .portfolio-grid {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }
    .portfolio-item {
      position: relative;
      overflow: hidden;
      aspect-ratio: 3 / 2;
      background: #e8e2db;
      cursor: zoom-in;
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .portfolio-item.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .portfolio-item:nth-child(even) {
      transition-delay: 0.1s;
    }
    .portfolio-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.9s ease;
      filter: saturate(0.88) contrast(0.97);
    }
    .portfolio-item:hover img {
      transform: scale(1.03);
      filter: saturate(0.78) contrast(0.95);
    }
    .portfolio-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: flex-end;
      padding: 26px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .portfolio-item:hover .portfolio-overlay { opacity: 1; }
    .overlay-box {
      padding: 12px 16px;
      background: rgba(247, 243, 238, 0.8);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.4);
    }
    .overlay-box h2 {
      margin: 0 0 2px;
      font-size: 9.5px;
      font-weight: 300;
      letter-spacing: 0.42em;
      text-transform: uppercase;
    }
    .overlay-box p {
      margin: 0;
      font-size: 13px;
      font-style: italic;
      font-weight: 300;
      color: #5a4f49;
    }
